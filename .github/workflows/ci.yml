name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check
      - name: Lint (pyflakes + ruff) and type check (mypy)
        working-directory: phase4
        run: |
          python -m pyflakes app.py views data utils tests
          ruff check app.py views data utils
          python -m mypy app.py views data utils --ignore-missing-imports
      - name: Unit, integration and Streamlit AppTest suite (coverage of the data layer)
        working-directory: phase4
        run: |
          coverage run --source=data,utils -m pytest -m "not browser" --junitxml=test-results.xml
          coverage report --fail-under=85
          coverage xml
      - name: App starts and reports healthy
        working-directory: phase4
        run: |
          streamlit run app.py --server.headless true --server.port 8599 --browser.gatherUsageStats false &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8599/_stcore/health && exit 0; sleep 1; done
          echo "Streamlit did not become healthy" && exit 1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            phase4/test-results.xml
            phase4/coverage.xml
          if-no-files-found: ignore

  audit:
    # Informational: reports known vulnerabilities in the pinned dependencies.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r requirements.txt

  browser:
    # Real-browser checks (contrast, sidebar reopening, file downloads).
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser tests
        working-directory: phase4
        run: python -m pytest tests/browser -m browser --junitxml=browser-results.xml
        env:
          RUN_BROWSER_TESTS: "1"
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: phase4/browser-results.xml
          if-no-files-found: ignore
